substitutions:
  name: "waveshare-7inch-display"
  friendly_name: "Camper Display"

  # ==========================================================================
  # HOME ASSISTANT ENTITY-IDs
  # Hier die eigenen Entity-IDs eintragen, ohne den Rest der Datei anzufassen.
  # ==========================================================================

  # --- Tanks & Batterie ---
  entity_frischwasser_stand: "sensor.bluelevel_ssbtee24_fullstand_3"
  entity_grauwasser_stand: "sensor.abwasser_tank_level"
  entity_batterie_stand: "sensor.wohnmobil_batterie_batterie"

  # --- Tankgrößen in Litern (Skala der Rundinstrumente) ---
  tank_frischwasser_liter: "200"
  tank_grauwasser_liter: "100"

  # --- Truma Heizung: Status & Sensoren ---
  entity_truma_fehler: "binary_sensor.truma_heizung_hat_fehler"
  entity_truma_verbunden: "binary_sensor.truma_cp_plus_online"
  entity_truma_raumtemperatur_aktuell: "sensor.truma_aktuelle_raumtemperatur"
  entity_truma_wassertemperatur_aktuell: "sensor.truma_aktuelle_wassertemperatur"
  entity_truma_raumtemperatur_soll_sensor: "sensor.truma_target_room_temperature"

  # --- Truma Heizung: Steuerung ---
  entity_truma_raumheizung_schalter: "switch.activate_room_heater"
  entity_truma_boiler_schalter: "switch.activate_water_heater"
  entity_truma_raumtemperatur_soll: "number.target_room_temperature"
  entity_truma_wassertemperatur_soll: "number.target_water_temperature"

  # --- Neigungssensoren (Wasserwaage) ---
  entity_neigung_laengs: "sensor.bluelevel_ssbtee24_langsneigung_2"
  entity_neigung_seitlich: "sensor.bluelevel_ssbtee24_seitenneigung_2"

  # --- Reifendruck (TPMS) ---
  entity_reifen_vorne_links: "sensor.tpms_f633_pressure"
  entity_reifen_vorne_rechts: "sensor.tpms_ef40_pressure"
  entity_reifen_hinten_links: "sensor.tpms_8f4b_pressure"
  entity_reifen_hinten_rechts: "sensor.tpms_ee32_pressure"
  entity_reifen_vorne_links_temp: "sensor.tpms_f633_temperature"
  entity_reifen_vorne_rechts_temp: "sensor.tpms_ef40_temperature"
  entity_reifen_hinten_links_temp: "sensor.tpms_8f4b_temperature"
  entity_reifen_hinten_rechts_temp: "sensor.tpms_ee32_temperature"
  entity_reifen_vorne_links_batterie: "sensor.tpms_f633_battery"
  entity_reifen_vorne_rechts_batterie: "sensor.tpms_ef40_battery"
  entity_reifen_hinten_links_batterie: "sensor.tpms_8f4b_battery"
  entity_reifen_hinten_rechts_batterie: "sensor.tpms_ee32_battery"

  # --- Fahrzeugmaße für Nivellierungs-Empfehlung (in cm) ---
  fahrzeug_spurbreite_cm: "200"
  fahrzeug_radstand_cm: "400"

  # --- Heizung Hinten (230V) ---
  entity_heizung_hinten: "climate.hinten_230v"

  # --- Licht ---
  entity_licht_decke: "light.led_decke_led_decke"
  entity_licht_bett_gross: "light.dusche_bett_gross"
  entity_licht_dusche: "light.dusche_dusche"
  entity_licht_markise: "light.led_makise_led_markise"
  entity_licht_wiz: "light.wiz_rgbw_tunable_e14e7a"
  # Platzhalter - bitte auf die echten Entity-IDs anpassen, sobald bekannt
  entity_licht_6: "light.licht_6_PLATZHALTER"
  entity_licht_7: "light.licht_7_PLATZHALTER"
  entity_licht_8: "light.licht_8_PLATZHALTER"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: "2025.8.0"
  platformio_options:
    board_upload.maximum_ram_size: 524288

# --- Truma CI-Bus / LIN Anbindung (auf diesem ESP32 mitintegriert) ---
external_components:
  - source:
      type: git
      url: https://github.com/havanti/esphome-truma
    components: [truma_inetbox, uart]
    refresh: always

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: octal
  speed: 80MHz

# --- Netwerk & basis ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

logger:
  baud_rate: 0   # UART-Logging aus, da GPIO43/44 jetzt vom Truma-UART belegt sind
  logs:
    truma_inetbox: DEBUG
    truma_inetbox.LinBusProtocol: DEBUG
    truma_inetbox.LinBusListener: DEBUG
    truma_inetbox.TrumaiNetBoxApp: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

# --- MQTT: zusätzlich zur HA-API alle Entities auch per MQTT veröffentlichen ---
# Broker-Zugangsdaten in secrets.yaml eintragen (siehe Hinweis unten).
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  # discovery: false   # einkommentieren, falls die Geräte NICHT zusätzlich
                        # per MQTT-Discovery in HA auftauchen sollen
                        # (du hast sie ja schon über die native API dort)

ota:
  - platform: esphome
    password: !secret ota_password

ch422g:
  - id: ch422g_hub

touchscreen:
  platform: gt911
  id: my_touchscreen
  i2c_id: bus_a
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false
  on_release:
    - if:
        condition:
          lambda: 'return id(screensaver_active);'
        then:
          - script.execute: restore_page_from_screensaver
          - lvgl.widget.redraw:

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: my_display
    rotation: 0
    update_interval: 1s
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    de_pin:
      number: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    pclk_inverted: true
    hsync_back_porch: 30
    hsync_front_porch: 210
    hsync_pulse_width: 30
    vsync_back_porch: 4
    vsync_front_porch: 4
    vsync_pulse_width: 4
    data_pins:
      red: [1, 2, 42, 41, 40]
      blue: [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]

switch:
  - platform: gpio
    id: lcdbacklight
    name: lcdbacklight
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false
    restore_mode: ALWAYS_ON

light:
  - platform: monochromatic
    name: "Display Backlight"
    output: fake_backlight_output
    id: display_backlight
    default_transition_length: 1s
    gamma_correct: 2.8

output:
  - platform: template
    id: fake_backlight_output
    type: float
    write_action:
      - lambda: |-
          ESP_LOGD("fake_light", "Fake brightness level: %.2f", state);

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: true

# --- Truma UART (CI-Bus / LIN, über Pegelwandler) ---
# Nutzt den physischen UART2-Header (P1: GND, RX, TX, +3.3V) dieses Boards.
# WICHTIG: UART1 (USB-Debug/Flash-Port) und UART2 (dieser Header) teilen
# sich intern dieselbe Hardware-UART0 (GPIO43/44) und werden per DIP-Schalter
# auf der Platine umgeschaltet. Schalter muss auf "UART2" stehen, damit der
# Header aktiv ist - dann ist der USB-Serial-Port für Flashen/Logs getrennt
# und Updates müssen per OTA laufen. Logger läuft daher hier nur noch über
# das Netzwerk (api/OTA), nicht mehr über USB-Seriell.
uart:
  - id: truma_uart
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 2

truma_inetbox:
  id: truma_inetbox_id
  uart_id: truma_uart
  time_id: ha_time

