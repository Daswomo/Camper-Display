# --- Smart Womo HA Logo (Bildschirmschoner) ---
image:
  - file: "images/smart_womo_logo.png"
    id: smart_womo_logo
    type: RGB
    transparency: alpha_channel
    resize: 320x69

  - file: "images/wheel_icon.png"
    id: wheel_icon
    type: RGB
    transparency: alpha_channel
    resize: 50x50

script:
  - id: update_level_bubble
    then:
      - lvgl.widget.update:
          id: w_level_bubble
          x: !lambda |-
            float scale = 8.0f;
            float raw_x = id(level_tilt_x) * scale;
            float raw_y = id(level_tilt_y) * scale;
            float mag = sqrtf(raw_x * raw_x + raw_y * raw_y);
            float max_r = 106.0f;
            if (mag > max_r && mag > 0) {
              raw_x = raw_x * max_r / mag;
              raw_y = raw_y * max_r / mag;
            }
            // 90° nach links gedreht: neue x-Achse = alte y-Achse
            float ox = raw_y;
            return 378 + (int) ox;
          y: !lambda |-
            float scale = 8.0f;
            float raw_x = id(level_tilt_x) * scale;
            float raw_y = id(level_tilt_y) * scale;
            float mag = sqrtf(raw_x * raw_x + raw_y * raw_y);
            float max_r = 106.0f;
            if (mag > max_r && mag > 0) {
              raw_x = raw_x * max_r / mag;
              raw_y = raw_y * max_r / mag;
            }
            // 90° nach links gedreht: neue y-Achse = -alte x-Achse
            float oy = -raw_x;
            return 228 + (int) oy;
      - lvgl.widget.redraw: w_level_bubble

  # --- Reifendruck: kombinierte Anzeige (Druck/Temp/Batterie) + separates cm-Label ---
  - id: update_tire_vl
    then:
      - lvgl.label.update:
          id: w_reifen_vl
          text:
            format: "Vorne Links\n%.1f bar | %.0f°C | %.0f%%"
            args: ["id(tire_vl_pressure)", "id(tire_vl_temp)", "id(tire_vl_battery)"]
      - lvgl.label.update:
          id: w_reifen_vl_cm
          text: !lambda |-
            float pitch = ${fahrzeug_radstand_cm} / 2.0f * tanf(id(level_tilt_x) * 3.14159265f / 180.0f);
            float roll = ${fahrzeug_spurbreite_cm} / 2.0f * tanf(id(level_tilt_y) * 3.14159265f / 180.0f);
            float h_vl = -pitch - roll;
            float h_vr = -pitch + roll;
            float h_hl = pitch - roll;
            float h_hr = pitch + roll;
            float max_h = fmaxf(fmaxf(h_vl, h_vr), fmaxf(h_hl, h_hr));
            float lift = max_h - h_vl;
            return str_sprintf("+%.1f cm", lift);

  - id: update_tire_vr
    then:
      - lvgl.label.update:
          id: w_reifen_vr
          text:
            format: "Vorne Rechts\n%.1f bar | %.0f°C | %.0f%%"
            args: ["id(tire_vr_pressure)", "id(tire_vr_temp)", "id(tire_vr_battery)"]
      - lvgl.label.update:
          id: w_reifen_vr_cm
          text: !lambda |-
            float pitch = ${fahrzeug_radstand_cm} / 2.0f * tanf(id(level_tilt_x) * 3.14159265f / 180.0f);
            float roll = ${fahrzeug_spurbreite_cm} / 2.0f * tanf(id(level_tilt_y) * 3.14159265f / 180.0f);
            float h_vl = -pitch - roll;
            float h_vr = -pitch + roll;
            float h_hl = pitch - roll;
            float h_hr = pitch + roll;
            float max_h = fmaxf(fmaxf(h_vl, h_vr), fmaxf(h_hl, h_hr));
            float lift = max_h - h_vr;
            return str_sprintf("+%.1f cm", lift);

  - id: update_tire_hl
    then:
      - lvgl.label.update:
          id: w_reifen_hl
          text:
            format: "Hinten Links\n%.1f bar | %.0f°C | %.0f%%"
            args: ["id(tire_hl_pressure)", "id(tire_hl_temp)", "id(tire_hl_battery)"]
      - lvgl.label.update:
          id: w_reifen_hl_cm
          text: !lambda |-
            float pitch = ${fahrzeug_radstand_cm} / 2.0f * tanf(id(level_tilt_x) * 3.14159265f / 180.0f);
            float roll = ${fahrzeug_spurbreite_cm} / 2.0f * tanf(id(level_tilt_y) * 3.14159265f / 180.0f);
            float h_vl = -pitch - roll;
            float h_vr = -pitch + roll;
            float h_hl = pitch - roll;
            float h_hr = pitch + roll;
            float max_h = fmaxf(fmaxf(h_vl, h_vr), fmaxf(h_hl, h_hr));
            float lift = max_h - h_hl;
            return str_sprintf("+%.1f cm", lift);

  - id: update_tire_hr
    then:
      - lvgl.label.update:
          id: w_reifen_hr
          text:
            format: "Hinten Rechts\n%.1f bar | %.0f°C | %.0f%%"
            args: ["id(tire_hr_pressure)", "id(tire_hr_temp)", "id(tire_hr_battery)"]
      - lvgl.label.update:
          id: w_reifen_hr_cm
          text: !lambda |-
            float pitch = ${fahrzeug_radstand_cm} / 2.0f * tanf(id(level_tilt_x) * 3.14159265f / 180.0f);
            float roll = ${fahrzeug_spurbreite_cm} / 2.0f * tanf(id(level_tilt_y) * 3.14159265f / 180.0f);
            float h_vl = -pitch - roll;
            float h_vr = -pitch + roll;
            float h_hl = pitch - roll;
            float h_hr = pitch + roll;
            float max_h = fmaxf(fmaxf(h_vl, h_vr), fmaxf(h_hl, h_hr));
            float lift = max_h - h_hr;
            return str_sprintf("+%.1f cm", lift);

  - id: restore_page_from_screensaver
    then:
      - lambda: 'id(screensaver_active) = false;'
      - if:
          condition:
            lambda: 'return id(display_page) == 0;'
          then:
            - lvgl.page.show: page_0
      - if:
          condition:
            lambda: 'return id(display_page) == 1;'
          then:
            - lvgl.page.show: page_1
      - if:
          condition:
            lambda: 'return id(display_page) == 2;'
          then:
            - lvgl.page.show: page_2
      - if:
          condition:
            lambda: 'return id(display_page) == 3;'
          then:
            - lvgl.page.show: page_3
      - if:
          condition:
            lambda: 'return id(display_page) == 4;'
          then:
            - lvgl.page.show: page_4

  - id: manage_run_and_sleep
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !(id(ha_time).now().is_valid() && api_is_connected());'
          then:
            - logger.log: "Waiting for sync..."
            - wait_until:
                condition:
                  lambda: 'return id(ha_time).now().is_valid() && api_is_connected();'
                timeout: 120s
      - if:
          condition:
            lambda: 'return id(initial_sensor_sync_pending);'
          then:
            - logger.log: "Waiting 5s for initial sensor updates..."
            - delay: 5s
            - lambda: 'id(initial_sensor_sync_pending) = false;'
      - lambda: |-
          int p = id(display_page);
          int interval = id(page_refresh_default_s);
          id(page_refresh_current_s) = interval;
      - delay: !lambda 'return id(page_refresh_current_s) * 1000;'
      - script.execute: manage_run_and_sleep
# ============================================================================
# LVGL Configuration
# ============================================================================

lvgl:
  id: my_lvgl
  log_level: WARN
  bg_color: "0x000000"
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: my_touchscreen
  on_idle:
    timeout: 5min
    then:
      - lambda: 'id(screensaver_active) = true;'
      - lvgl.page.show: page_screensaver
  pages:
    - id: page_0
      widgets:
        # --- Frischwasser: Gauge mit Farbverlauf (Rot=leer, Grün=voll), Skala siehe tank_frischwasser_liter ---
        - meter:
            id: w_mt394t4512ra6
            bg_color: "0x1A1A1A"
            height: 180
            scales:
              -
                angle_range: 270
                range_from: 0
                range_to: ${tank_frischwasser_liter}
                rotation: 135
                ticks:
                  color: "0x666666"
                  count: 11
                  length: 8
                  major:
                    color: "0xCCCCCC"
                    label_gap: 10
                    length: 12
                    stride: 1
                    width: 3
                  width: 2
                indicators:
                  - tick_style:
                      start_value: 0
                      end_value: ${tank_frischwasser_liter}
                      color_start: "0xFF0000"
                      color_end: "0x00FF00"
                  - line:
                      id: w_mt394t4512ra6_ind
                      color: "0xFFFFFF"
                      r_mod: -10
                      value: 0
                      width: 4
            width: 180
