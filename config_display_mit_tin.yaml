# ============================================================
# Truma: lokale Entities (direkt vom truma_inetbox auf diesem
# selben ESP32, unabhängig vom HA-Roundtrip oben im LVGL-Teil)
# Diese Entities werden zusätzlich über api: an Home Assistant
# gemeldet. Die bestehenden LVGL-Bindings weiter oben nutzen
# weiterhin die "homeassistant:"-Platform-Entities (truma_*) -
# die sind unverändert und funktionieren weiter wie bisher.
# ============================================================

climate:
  - platform: truma_inetbox
    truma_inetbox_id: truma_inetbox_id
    id: local_truma_aircon
    name: "Aircon"
    type: AIRCON
    # Kein Heizbetrieb verfügbar (keine Heizung/kein Wärmepumpen-Aventa)
    supported_modes:
      - "OFF"
      - "COOL"
      - "FAN_ONLY"
    on_state:
      - lvgl.label.update:
          id: w_aircon_temp_value
          text: !lambda |-
            float t = id(local_truma_aircon).current_temperature;
            if (std::isnan(t)) return std::string("Aktuell: -- °C");
            return str_sprintf("Aktuell: %.1f °C", t);
      - lvgl.arc.update:
          id: w_aircon_target_arc
          value: !lambda |-
