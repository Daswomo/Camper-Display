        # --- Großes Thermostat ---
        - arc:
            id: w_hh_target_arc
            x: 300
            y: 60
            width: 200
            height: 200
            min_value: 5
            max_value: 35
            start_angle: 135
            end_angle: 45
            arc_width: 16
            arc_rounded: true
            adjustable: true
            change_rate: 360
            indicator:
              arc_color: "0xFF6B35"
            value: !lambda return (int) id(heizung_hinten_target_temp).state;
            on_value:
              - lvgl.label.update:
                  id: w_hh_target_arc_value
                  text:
                    format: "%.0f°"
                    args: ["x"]
            on_release:
              - homeassistant.action:
                  action: climate.set_temperature
                  data:
                    entity_id: ${entity_heizung_hinten}
                  variables:
                    new_temp: !lambda 'return (float) x;'
                  data_template:
                    temperature: "{{ new_temp }}"
            widgets:
              - label:
                  id: w_hh_target_arc_value
                  align: center
                  text: "16°"
                  text_color: "0xFFFFFF"
                  text_font: font_roboto_700_44

        - label:
            id: w_hh_current_temp
            border_side: none
            height: 24
            radius: 0
            text: "Aktuell: -- °C"
            text_align: center
            text_color: "0xAAAAAA"
            text_font: font_roboto_400_14
            width: 200
            x: 300
            y: 262

        # --- Ein/Aus (heat/off) ---
        - button:
            id: w_hh_toggle
            checkable: true
            height: 44
            width: 200
            x: 300
            y: 295
            on_click:
              - lambda: |-
                  ESP_LOGD("heizung_hinten", "Toggle-Klick, aktueller Modus laut Sensor: '%s'", id(heizung_hinten_mode).state.c_str());
              - if:
                  condition:
                    lambda: 'return id(heizung_hinten_mode).state == "heat";'
                  then:
                    - homeassistant.action:
                        action: climate.set_hvac_mode
                        data:
                          entity_id: ${entity_heizung_hinten}
                          hvac_mode: "off"
                  else:
                    - homeassistant.action:
                        action: climate.set_hvac_mode
                        data:
                          entity_id: ${entity_heizung_hinten}
                          hvac_mode: "heat"
            state:
              checked: !lambda return id(heizung_hinten_mode).state == "heat";
            widgets:
              -
                label:
                  align: center
                  text: "Heizung"
                  text_color: "0xFFFFFF"
                  text_font: font_roboto_400_14

