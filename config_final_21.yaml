binary_sensor:
  # --- Truma Status ---
  - platform: homeassistant
    id: truma_heater_error
    entity_id: ${entity_truma_fehler}
    internal: true
    on_state:
      - if:
          condition:
            lambda: return x;
          then:
            - lvgl.label.update:
                id: w_truma_error_label
                text: "FEHLER!"
                text_color: "0xFF0000"
          else:
            - lvgl.label.update:
                id: w_truma_error_label
                text: "Kein Fehler"
                text_color: "0x00FF00"

  - platform: homeassistant
    id: truma_cp_plus_online
    entity_id: ${entity_truma_verbunden}
    internal: true

sensor:
  - platform: homeassistant
    id: sensor_bluelevel_ssbtee24_fullstand_3
    entity_id: ${entity_frischwasser_stand}
    on_value:
      then:
        - lvgl.indicator.update:
            id: w_mt394t4512ra6_ind
            value: !lambda "return x;"
        - lvgl.widget.refresh: w_mt47tocv9km4h
    internal: true
  - platform: homeassistant
    id: sensor_abwasser_tank_level
    entity_id: ${entity_grauwasser_stand}
    on_value:
      then:
        - lvgl.indicator.update:
            id: w_mt3bc6mnpar0u_ind
            value: !lambda "return x;"
        - lvgl.widget.refresh: w_mt47uiuinf13s
    internal: true
  - platform: homeassistant
    id: sensor_wohnmobil_batterie_batterie
    entity_id: ${entity_batterie_stand}
    on_value:
      then:
        - lvgl.indicator.update:
                  id: w_mt3cgfftkoy3z_ind
                  value: !lambda "return x;"
        - lvgl.widget.refresh: w_mt3d2ajrwdrdo
    internal: true

  # --- Truma Temperaturen ---
  - platform: homeassistant
    id: truma_current_room_temp
    entity_id: ${entity_truma_raumtemperatur_aktuell}
    internal: true
    on_value:
      - lvgl.label.update:
          id: w_room_temp_value
          text:
            format: "Aktuell: %.1f °C"
            args: ["x"]

  - platform: homeassistant
    id: truma_current_water_temp
    entity_id: ${entity_truma_wassertemperatur_aktuell}
    internal: true
    on_value:
      - lvgl.label.update:
          id: w_water_temp_value
          text:
            format: "%.1f °C"
            args: ["x"]

  - platform: homeassistant
    id: truma_target_room_temp
    entity_id: ${entity_truma_raumtemperatur_soll_sensor}
    internal: true

  # --- Truma Solltemperaturen: Sync HA -> Display ---
  - platform: homeassistant
    id: truma_target_room_temp_current
    entity_id: ${entity_truma_raumtemperatur_soll}
    internal: true
    on_value:
      - lvgl.arc.update:
          id: w_room_target_arc
          value: !lambda 'return (int) x;'
      - lvgl.label.update:
          id: w_room_target_arc_value
          text:
            format: "%.0f°"
            args: ["x"]

  - platform: homeassistant
    id: truma_target_water_temp_current
    entity_id: ${entity_truma_wassertemperatur_soll}
    internal: true
    on_value:
      - lvgl.widget.refresh: w_water_target_off
      - lvgl.widget.refresh: w_water_target_40
      - lvgl.widget.refresh: w_water_target_60
      - lvgl.widget.refresh: w_water_target_80

  # --- Position / Wasserwaage ---
  - platform: homeassistant
    id: sensor_langsneigung
    entity_id: ${entity_neigung_laengs}
    internal: true
    on_value:
      then:
        - lambda: 'id(level_tilt_x) = x;'
        - script.execute: update_level_bubble

  - platform: homeassistant
    id: sensor_seitenneigung
    entity_id: ${entity_neigung_seitlich}
    internal: true
    on_value:
      then:
        - lambda: 'id(level_tilt_y) = x;'
        - script.execute: update_level_bubble

  # --- Heizung Hinten (230V) ---
  - platform: homeassistant
    id: heizung_hinten_current_temp
    entity_id: ${entity_heizung_hinten}
    attribute: current_temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: w_hh_current_temp
          text:
            format: "Aktuell: %.1f °C"
            args: ["x"]

  - platform: homeassistant
    id: heizung_hinten_target_temp
    entity_id: ${entity_heizung_hinten}
    attribute: temperature
    internal: true
    on_value:
      - lvgl.arc.update:
          id: w_hh_target_arc
          value: !lambda 'return (int) x;'
      - lvgl.label.update:
          id: w_hh_target_arc_value
          text:
            format: "%.0f°"
            args: ["x"]

  # --- Licht Helligkeit ---
  - platform: homeassistant
    id: licht_decke_brightness
    entity_id: ${entity_licht_decke}
    attribute: brightness
    internal: true
    on_value:
      - lvgl.slider.update:
          id: w_licht_decke_slider
          value: !lambda 'return (int) (x / 255.0 * 100.0);'

  - platform: homeassistant
    id: licht_bett_brightness
    entity_id: ${entity_licht_bett_gross}
    attribute: brightness
    internal: true
    on_value:
      - lvgl.slider.update:
          id: w_licht_bett_slider
          value: !lambda 'return (int) (x / 255.0 * 100.0);'

  - platform: homeassistant
    id: licht_dusche_brightness
    entity_id: ${entity_licht_dusche}
    attribute: brightness
    internal: true
    on_value:
      - lvgl.slider.update:
          id: w_licht_dusche_slider
          value: !lambda 'return (int) (x / 255.0 * 100.0);'

  - platform: homeassistant
    id: licht_markise_brightness
    entity_id: ${entity_licht_markise}
    attribute: brightness
    internal: true
    on_value:
      - lvgl.slider.update:
          id: w_licht_markise_slider
          value: !lambda 'return (int) (x / 255.0 * 100.0);'

text_sensor:
  - platform: homeassistant
    id: heizung_hinten_mode
    entity_id: ${entity_heizung_hinten}
    internal: true
    on_value:
      - lvgl.widget.refresh: w_hh_toggle

  # --- Licht Status ---
  - platform: homeassistant
